name: Deploy to GitHub Pages

# Runs on every push to main (or master), and from the Actions tab with "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional. Set these under Settings > Secrets and variables > Actions > Variables.
          VITE_ORDER_ENDPOINT: ${{ vars.VITE_ORDER_ENDPOINT }}
          VITE_PRICE_SHEET_URL: ${{ vars.VITE_PRICE_SHEET_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
